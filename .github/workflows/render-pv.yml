name: Render & Release Jensen PV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: Render Chunk ${{ matrix.chunk }}/7
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Install CJK fonts & Chromium runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-cjk \
            libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2
          fc-cache -f

      - name: Ensure Remotion Headless Browser
        run: npx remotion browser ensure

      - name: Render Chunk ${{ matrix.chunk }}
        run: |
          mkdir -p out
          START=$((${{ matrix.chunk }} * 1925))
          END=$((START + 1924))
          echo "Rendering frames ${START}..${END}"
          npx remotion render src/index.ts JensenPV "out/chunk-${{ matrix.chunk }}.mp4" \
            --frames="${START}-${END}" \
            --muted \
            --gl=swangle \
            --codec=h264 \
            --crf=17 \
            --pixel-format=yuv420p \
            --image-format=jpeg \
            --jpeg-quality=92 \
            --concurrency=4 \
            --timeout=60000

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk }}
          path: out/chunk-${{ matrix.chunk }}.mp4
          retention-days: 1

  stitch-and-release:
    name: Stitch Video, Mux Audio & Publish Release
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all rendered chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          merge-multiple: true
          path: out/chunks

      - name: Stitch video & mux MP3 audio
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          mkdir -p out/final
          : > out/concat_list.txt
          for i in 0 1 2 3 4 5 6 7; do
            FILE="$(pwd)/out/chunks/chunk-${i}.mp4"
            test -s "${FILE}"
            echo "file '${FILE}'" >> out/concat_list.txt
          done
          ffmpeg -y -f concat -safe 0 -i out/concat_list.txt -c copy out/video_only.mp4
          ffmpeg -y -i out/video_only.mp4 -i public/audio.mp3 \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 192k \
            -shortest -movflags +faststart \
            out/final/jensen-guimixinqiao-pv.mp4
          ffprobe -v error -show_entries format=duration,size -show_streams out/final/jensen-guimixinqiao-pv.mp4

      - name: Upload final MP4 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jensen-guimixinqiao-pv
          path: out/final/jensen-guimixinqiao-pv.mp4
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pv-v1.${{ github.run_number }}"
          gh release create "${TAG}" \
            out/final/jensen-guimixinqiao-pv.mp4 \
            --title "黄仁勋 - 鬼迷心窍 (AI整蛊版) PV · ${TAG}" \
            --notes "Full 1920x1080 60fps narrative neo-noir Remotion render (256.67s / 15400 frames) with synced audio."
